<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="RepoBlackbox terminal demo">
  <title>RepoBlackbox terminal demo</title>

  <!-- Page background -->
  <rect width="960" height="520" fill="#0d1117"/>

  <!-- Card background -->
  <rect x="10" y="10" width="940" height="500" rx="10" fill="#161b22"/>

  <!-- Title bar: two rects — the first has rx=10 (all corners rounded),
       the second squares off the bottom two corners.
       No clipPath needed; GitHub strips defs/clipPath which breaks rendering. -->
  <rect x="10" y="10" width="940" height="46" rx="10" fill="#21262d"/>
  <rect x="10" y="46" width="940" height="10" fill="#21262d"/>

  <!-- Divider below title bar -->
  <rect x="10" y="55" width="940" height="1" fill="#30363d"/>

  <!-- Card border -->
  <rect x="10" y="10" width="940" height="500" rx="10" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Window control dots -->
  <circle cx="37" cy="33" r="6" fill="#ff5f57"/>
  <circle cx="58" cy="33" r="6" fill="#febc2e"/>
  <circle cx="79" cy="33" r="6" fill="#28c840"/>

  <!-- Window title -->
  <text x="480" y="33" font-family="monospace" font-size="12" fill="#8b949e" text-anchor="middle" dominant-baseline="middle">RepoBlackbox — demo</text>

  <!-- ============================================================
       Content — font-size 15 · line-height ~22px
       Block gaps: 40px between command groups
       ============================================================ -->

  <!-- ── Block 1: scope ──────────────────────────────────────── -->

  <text x="32" y="86"  font-family="monospace" font-size="15"><tspan fill="#58a6ff">$</tspan><tspan fill="#c9d1d9"> repoblackbox scope --task </tspan><tspan fill="#a5d6ff">"Refactor homepage hero"</tspan><tspan fill="#c9d1d9"> \</tspan></text>
  <text x="32" y="108" font-family="monospace" font-size="15"><tspan fill="#c9d1d9">    --allow </tspan><tspan fill="#a5d6ff">"src/components/home/**"</tspan><tspan fill="#c9d1d9"> --forbid </tspan><tspan fill="#a5d6ff">".env,package.json"</tspan></text>
  <text x="32" y="130" font-family="monospace" font-size="15"><tspan fill="#3fb950">  ✔</tspan><tspan fill="#8b949e"> Scope saved to TASK_SCOPE.md</tspan></text>
  <text x="32" y="152" font-family="monospace" font-size="15"><tspan fill="#3fb950">  ✔</tspan><tspan fill="#8b949e"> Machine-readable scope saved (.repoblackbox/runs/latest-scope.json)</tspan></text>

  <!-- ── Block 2: snapshot ───────────────────────────────────── -->

  <text x="32" y="196" font-family="monospace" font-size="15"><tspan fill="#58a6ff">$</tspan><tspan fill="#c9d1d9"> repoblackbox snapshot </tspan><tspan fill="#a5d6ff">"before claude task"</tspan></text>
  <text x="32" y="218" font-family="monospace" font-size="15"><tspan fill="#3fb950">  ✔</tspan><tspan fill="#8b949e"> Snapshot captured  (42 files hashed)</tspan></text>
  <text x="32" y="240" font-family="monospace" font-size="15"><tspan fill="#3fb950">  ✔</tspan><tspan fill="#8b949e"> Sensitive files recorded without reading contents</tspan></text>

  <!-- ── Block 3: audit ─────────────────────────────────────── -->

  <text x="32" y="284" font-family="monospace" font-size="15"><tspan fill="#58a6ff">$</tspan><tspan fill="#c9d1d9"> repoblackbox audit</tspan></text>

  <text x="32" y="316" font-family="monospace" font-size="15" font-weight="bold"><tspan fill="#c9d1d9">  Changes</tspan></text>
  <text x="32" y="338" font-family="monospace" font-size="15"><tspan fill="#8b949e">    Added    </tspan><tspan fill="#3fb950">(1)</tspan><tspan fill="#8b949e">:  </tspan><tspan fill="#79c0ff">src/components/home/Hero.tsx</tspan></text>
  <text x="32" y="360" font-family="monospace" font-size="15"><tspan fill="#8b949e">    Modified </tspan><tspan fill="#d29922">(1)</tspan><tspan fill="#8b949e">:  </tspan><tspan fill="#f85149">package.json</tspan></text>

  <text x="32" y="392" font-family="monospace" font-size="15"><tspan fill="#d29922">  ⚠</tspan><tspan fill="#c9d1d9">  Scope violation: </tspan><tspan fill="#f85149">package.json</tspan><tspan fill="#c9d1d9"> matches forbidden pattern</tspan></text>
  <text x="32" y="420" font-family="monospace" font-size="15"><tspan fill="#c9d1d9">  Risk Level: </tspan><tspan fill="#f85149" font-weight="bold">HIGH</tspan></text>

  <!-- ── Block 4: report ────────────────────────────────────── -->

  <text x="32" y="462" font-family="monospace" font-size="15"><tspan fill="#58a6ff">$</tspan><tspan fill="#c9d1d9"> repoblackbox report</tspan></text>
  <text x="32" y="484" font-family="monospace" font-size="15"><tspan fill="#3fb950">  ✔</tspan><tspan fill="#8b949e"> Report saved to </tspan><tspan fill="#79c0ff">.repoblackbox/reports/latest-report.md</tspan></text>

</svg>
